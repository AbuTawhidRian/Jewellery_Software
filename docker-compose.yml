version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jewellery_saas_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jewellery_saas
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jewellery_net

networks:
  jewellery_net:
    driver: bridge

volumes:
  postgres_data:
